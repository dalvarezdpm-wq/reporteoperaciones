<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>

<style>
  :root{
    --bg:#EEF1EF; --panel:#FFFFFF; --navy:#182A38; --navy-2:#22394A; --ink:#182A38;
    --muted:#5B6B72; --line:#DBE1DE; --accent:#2B6E63; --accent-dark:#1E4F47;
    --verde:#3F8F5F; --rojo:#C0453B; --ambar:#D98F2B; --radius:10px;
  }
  *{box-sizing:border-box;}
  #app-root{font-family:'IBM Plex Sans',sans-serif; color:var(--ink); background:var(--bg); min-height:600px; border-radius:12px; overflow:hidden; display:flex; flex-direction:column;}
  .display{font-family:'Oswald',sans-serif; letter-spacing:.02em;}
  .mono{font-family:'IBM Plex Mono',monospace;}

  .topbar{background:var(--navy); color:#fff; padding:14px 20px; display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;}
  .brand{display:flex; align-items:center; gap:10px;}
  .brand-mark{width:34px;height:34px;border-radius:50%; border:2px solid #E2C08D; display:flex;align-items:center;justify-content:center; font-family:'Oswald',sans-serif; font-weight:700; font-size:12px; color:#E2C08D; flex-shrink:0;}
  .brand-text .t1{font-family:'Oswald',sans-serif;font-weight:600;font-size:16px;line-height:1.1;}
  .brand-text .t2{font-size:11px;color:#9FB2BC;letter-spacing:.06em;text-transform:uppercase;}
  .user-chip{display:flex;align-items:center;gap:8px; background:var(--navy-2); padding:6px 12px; border-radius:20px; font-size:13px;}
  .user-dot{width:8px;height:8px;border-radius:50%;background:var(--verde);}
  .nav-btn{background:transparent;border:1px solid #3A5262;color:#DCE6E9; padding:5px 10px;border-radius:6px;font-size:12px;cursor:pointer;}
  .nav-btn:hover{background:var(--navy-2);}

  .content{padding:20px; flex:1; overflow-y:auto;}
  @media (max-width:640px){.content{padding:14px;}}

  .btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; padding:11px 18px; border-radius:8px; border:none; cursor:pointer; font-family:'IBM Plex Sans',sans-serif; font-weight:600; font-size:14px; transition:transform .08s ease, background .15s ease;}
  .btn:active{transform:scale(.98);}
  .btn-primary{background:var(--accent); color:#fff;}
  .btn-primary:hover{background:var(--accent-dark);}
  .btn-ghost{background:transparent; color:var(--accent); border:1.5px solid var(--accent);}
  .btn-ghost:hover{background:#EAF2F0;}
  .btn-sm{padding:7px 12px;font-size:12.5px;}
  .btn:disabled{opacity:.5;cursor:not-allowed;}

  .login-wrap{min-height:520px; display:flex; align-items:center; justify-content:center; flex-direction:column; background:radial-gradient(circle at 15% 20%, rgba(43,110,99,.10), transparent 40%), radial-gradient(circle at 85% 80%, rgba(217,143,43,.10), transparent 40%), var(--bg); padding:30px;}
  .login-card{background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:36px 30px; max-width:380px; width:100%; text-align:center; box-shadow:0 10px 30px rgba(24,42,56,.06);}
  .login-mark{width:64px;height:64px;border-radius:50%;border:3px solid var(--navy); margin:0 auto 16px; display:flex; align-items:center; justify-content:center; font-family:'Oswald',sans-serif; font-weight:700; color:var(--navy); font-size:20px;}
  .login-title{font-size:22px; font-weight:600; margin-bottom:4px;}
  .login-sub{color:var(--muted); font-size:13px; margin-bottom:24px;}
  .user-pick{display:flex; flex-direction:column; gap:10px;}
  .user-pick-btn{padding:14px; border-radius:10px; border:1.5px solid var(--line); background:#fafbfa; text-align:left; cursor:pointer; font-size:15px; font-weight:600; color:var(--ink); display:flex; align-items:center; gap:12px;}
  .user-pick-btn:hover{border-color:var(--accent); background:#F1F7F5;}
  .user-avatar{width:34px;height:34px;border-radius:50%;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-family:'Oswald',sans-serif;font-size:14px;}

  .panel{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:18px;}
  .section-title{font-family:'Oswald',sans-serif; font-size:18px; font-weight:600; margin:0 0 4px;}
  .section-sub{color:var(--muted); font-size:12.5px; margin:0 0 16px;}
  .subhead{font-family:'Oswald',sans-serif; font-size:14px; font-weight:600; margin:18px 0 10px; padding-top:10px; border-top:1px solid var(--line); display:flex; align-items:center; gap:8px;}
  .subhead:first-of-type{border-top:none; padding-top:0; margin-top:6px;}

  .stats-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:18px;}
  @media (max-width:720px){.stats-grid{grid-template-columns:repeat(2,1fr);}}
  .stat-card{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:14px 16px;}
  .stat-num{font-family:'Oswald',sans-serif; font-size:24px; font-weight:600; color:var(--navy);}
  .stat-label{font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; margin-top:2px;}

  .top-actions{display:flex; justify-content:space-between; align-items:center; margin-bottom:18px; gap:10px; flex-wrap:wrap;}
  .chart-row{display:grid; grid-template-columns:1.1fr 0.7fr 0.9fr; gap:14px; margin-bottom:20px;}
  @media (max-width:900px){.chart-row{grid-template-columns:1fr;}}

  .day-card{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:14px 16px; margin-bottom:10px; cursor:pointer; transition:border-color .12s;}
  .day-card:hover{border-color:var(--accent);}
  .day-card-head{display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px;}
  .day-date{font-family:'Oswald',sans-serif; font-size:16px; font-weight:600;}
  .day-meta{color:var(--muted); font-size:12.5px;}
  .pill{display:inline-flex; align-items:center; gap:5px; font-size:11px; padding:3px 9px; border-radius:20px; font-weight:600;}
  .pill-verde{background:#E3F1E7; color:var(--verde);}
  .pill-navy{background:#E7ECEF; color:var(--navy);}

  .empty{text-align:center; padding:50px 20px; color:var(--muted);}
  .empty .stamp-outline{width:70px;height:70px;border-radius:50%;border:2px dashed var(--line); margin:0 auto 14px; display:flex; align-items:center; justify-content:center; font-size:26px;}

  .capture-grid{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
  @media (max-width:640px){.capture-grid{grid-template-columns:1fr;}}
  .capture-tile{border:1.5px dashed var(--line); border-radius:12px; padding:30px 16px; text-align:center; background:var(--panel); cursor:pointer; transition:border-color .12s, background .12s;}
  .capture-tile:hover{border-color:var(--accent); background:#F4F9F7;}
  .capture-tile .icon{font-size:30px; margin-bottom:10px;}
  .capture-tile .label{font-weight:600; font-size:14.5px;}
  .capture-tile .hint{color:var(--muted); font-size:12px; margin-top:4px;}

  .text-preview-box{text-align:left; max-height:340px; overflow-y:auto; background:#20262b; color:#DCE6E9; border-radius:10px; padding:14px 16px; font-family:'IBM Plex Mono',monospace; font-size:11.5px; white-space:pre-wrap; margin-bottom:16px; border:1px solid var(--line);}
  .source-badge{display:inline-flex; align-items:center; gap:5px; font-size:11px; padding:3px 9px; border-radius:20px; font-weight:600; background:#E7ECEF; color:var(--navy); margin-bottom:10px;}
  .preview-wrap{text-align:center;}
  .preview-canvas-box{max-width:100%; border:1px solid var(--line); border-radius:10px; overflow:hidden; background:#20262b; display:inline-block; margin-bottom:14px;}
  .preview-canvas-box canvas{display:block; max-width:100%; height:auto;}
  .rotate-controls{display:flex; justify-content:center; gap:8px; margin-bottom:16px; flex-wrap:wrap;}

  .status-line{display:flex; align-items:flex-start; gap:10px; padding:14px; border-radius:8px; background:#F1F7F5; color:var(--accent-dark); font-size:13.5px; font-weight:500; text-align:left;}
  .status-error{background:#FBE9E7; color:var(--rojo);}
  .spinner{width:16px;height:16px;border-radius:50%; border:2.5px solid #cfe4de; border-top-color:var(--accent); animation:spin .8s linear infinite; flex-shrink:0; margin-top:2px;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .err-detail{font-family:'IBM Plex Mono',monospace; font-size:11px; opacity:.85; margin-top:4px; word-break:break-word;}

  .field-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:6px;}
  @media (max-width:800px){.field-grid{grid-template-columns:1fr 1fr;}}
  @media (max-width:480px){.field-grid{grid-template-columns:1fr;}}
  .field label{display:block; font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); margin-bottom:5px; font-weight:600;}
  .field input, .field select, .field textarea{width:100%; padding:9px 10px; border:1.3px solid var(--line); border-radius:7px; font-size:13.5px; font-family:'IBM Plex Sans',sans-serif; background:#fff; color:var(--ink);}
  .field input:focus, .field select:focus, .field textarea:focus{outline:none; border-color:var(--accent);}

  .table-wrap{overflow-x:auto; border:1px solid var(--line); border-radius:10px; margin-bottom:14px;}
  table.rows-table{border-collapse:collapse; width:100%;}
  table.rows-table th{background:var(--navy); color:#DCE6E9; font-size:10.5px; text-transform:uppercase; letter-spacing:.02em; padding:8px 6px; text-align:left; white-space:nowrap; font-weight:600;}
  table.rows-table td{padding:3px; border-bottom:1px solid var(--line); white-space:nowrap;}
  table.rows-table td input, table.rows-table td select{width:100%; min-width:90px; border:1px solid transparent; background:transparent; padding:6px 6px; font-size:12px; font-family:'IBM Plex Mono',monospace; border-radius:5px; color:var(--ink);}
  table.rows-table td input:focus, table.rows-table td select:focus{outline:none; border-color:var(--accent); background:#fff;}
  table.rows-table tr:hover td{background:#FAFBFA;}
  .row-del{background:none;border:none;color:var(--rojo);cursor:pointer;font-size:15px;padding:0 8px;}

  .actividades-list{display:flex; flex-direction:column; gap:8px; margin-bottom:10px;}
  .actividad-row{display:flex; gap:8px; align-items:center;}
  .actividad-row input{flex:1; padding:9px 10px; border:1.3px solid var(--line); border-radius:7px; font-size:13px;}
  .actividad-num{width:20px; color:var(--muted); font-size:13px; font-weight:600; flex-shrink:0;}

  .review-actions{display:flex; gap:10px; justify-content:flex-end; flex-wrap:wrap; margin-top:16px;}

  .stamp-screen{display:flex; flex-direction:column; align-items:center; justify-content:center; padding:60px 20px; text-align:center;}
  .stamp{width:130px; height:130px; border-radius:50%; border:4px double var(--verde); color:var(--verde); display:flex; flex-direction:column; align-items:center; justify-content:center; transform:rotate(-9deg); font-family:'Oswald',sans-serif; font-weight:700; animation:stampIn .35s cubic-bezier(.2,1.4,.4,1); margin-bottom:18px;}
  @keyframes stampIn{from{transform:rotate(-9deg) scale(2); opacity:0;} to{transform:rotate(-9deg) scale(1); opacity:1;}}
  .stamp .s1{font-size:14px; letter-spacing:.06em;}
  .stamp .s2{font-size:10px; margin-top:4px;}

  .captura-item{border:1px solid var(--line); border-radius:9px; padding:14px 16px; margin-bottom:12px; background:#fafbfa;}
  .captura-head{display:flex; justify-content:space-between; align-items:flex-start; gap:8px; flex-wrap:wrap; margin-bottom:10px;}
  .meta-line{color:var(--muted); font-size:12px; line-height:1.6;}
  .meta-line b{color:var(--ink);}
  .mini-table{width:100%; border-collapse:collapse; font-size:11.5px; margin-top:6px;}
  .mini-table th{text-align:left; color:var(--muted); font-weight:600; padding:4px 6px; border-bottom:1px solid var(--line); text-transform:uppercase; font-size:9.5px; white-space:nowrap;}
  .mini-table td{padding:5px 6px; border-bottom:1px solid #EEF1EF; font-family:'IBM Plex Mono',monospace; font-size:11px; white-space:nowrap;}
  .mini-title{font-weight:600; font-size:12.5px; margin-top:10px; margin-bottom:2px;}

  .back-link{background:none;border:none;color:var(--accent);font-size:13px;font-weight:600;cursor:pointer;padding:0;margin-bottom:14px;display:inline-flex;align-items:center;gap:5px;}

  .rank-row{display:flex; align-items:center; gap:8px; margin-bottom:8px; font-size:12.5px;}
  .rank-bar-bg{flex:1; background:#E7ECEF; border-radius:6px; height:9px; overflow:hidden;}
  .rank-bar{height:100%; background:var(--accent); border-radius:6px;}
  .rank-name{width:100px; flex-shrink:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .rank-val{width:22px; text-align:right; flex-shrink:0; font-family:'IBM Plex Mono',monospace;}

  .chip-list{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:10px;}
  .chip{background:#E7ECEF; color:var(--navy); padding:5px 10px; border-radius:20px; font-size:12.5px; display:flex; align-items:center; gap:6px;}
  .chip button{background:none;border:none;color:var(--rojo);cursor:pointer;font-size:13px;padding:0;}
  .cat-add{display:flex; gap:8px; margin-bottom:22px;}
  .cat-add input{flex:1; padding:8px 10px; border:1.3px solid var(--line); border-radius:7px; font-size:13px;}

  ::-webkit-scrollbar{height:8px;width:8px;}
  ::-webkit-scrollbar-thumb{background:#c7d0cd;border-radius:10px;}
</style>

<div id="app-root"></div>

<script>
(function(){
  const USERS = ["Davis", "Compañero(a)"];

  let editableCats = { clientes:["GLXI","Alkaps","MTI","FMI","IndoUnión","Foray","Alpha metal"], almacenes:["228","277"], coordinadores:["David"], tramitadores:["Luis Arroyo"] };

  const PREVIO_FIELDS = [
    {k:"ref", label:"Ref."},
    {k:"guia", label:"Guía"},
    {k:"cliente", label:"Cliente", cat:"clientes"},
    {k:"almacen", label:"Almacén", cat:"almacenes"},
    {k:"partidas", label:"Partidas"},
    {k:"tipoPrevio", label:"Tipo de previo"},
    {k:"asignacion", label:"Asignación"},
    {k:"inicio", label:"Inicio", type:"time"},
    {k:"fin", label:"Fin", type:"time"},
  ];
  const DESPACHO_FIELDS = [
    {k:"ref", label:"Ref."},
    {k:"guia", label:"Guía"},
    {k:"pedimento", label:"Pedimento"},
    {k:"cliente", label:"Cliente", cat:"clientes"},
    {k:"almacen", label:"Almacén", cat:"almacenes"},
    {k:"tipoDespacho", label:"Tipo despacho"},
    {k:"inicio", label:"Inicio", type:"time"},
    {k:"liberacion", label:"Liberación", type:"time"},
    {k:"resultado", label:"Resultado", cat:"resultados"},
  ];

  function emptyCaptura(){
    return {
      id: "c_"+Date.now()+"_"+Math.random().toString(36).slice(2,8),
      uploadedBy: null, horaCaptura: null, sourceType: null, sourceFileName: "",
      fecha: null, coordinadorOp:"", coordinador:"", tramitador:"", horaInicio:"", horaCierre:"", aduana:"",
      previos: [], despachos: [], otrasActividades: ["","","",""],
      elaboro:"", reviso:"", autorizo:"", thumb:null,
    };
  }

  let state = {
    user: null, view: "login", reports: {}, loading: true,
    workingCanvas: null, workingRotation: 0, workingMode: null, workingText: "", workingFileName: "",
    aiStatus: "", aiStatusType:"",
    currentCaptura: null, editingIndex:null, editingFecha:null,
    detailFecha: null, errorMsg: "", testStatus:"", testStatusType:"",
  };

  const root = document.getElementById("app-root");
  function esc(s){ return (s===undefined||s===null) ? "" : String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
  function todayStr(){ return new Date().toISOString().slice(0,10); }
  function fmtDateHuman(iso){
    if(!iso) return "Sin fecha";
    const [y,m,d] = iso.split("-");
    const meses=["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
    return `${d} ${meses[parseInt(m,10)-1]} ${y}`;
  }

  // ---------- persistence ----------
  async function loadReports(){
    try{
      const list = await window.storage.list("reporte:", true);
      const reports = {};
      if(list && list.keys){
        for(const k of list.keys){
          try{ const r = await window.storage.get(k, true); if(r && r.value){ const obj = JSON.parse(r.value); reports[obj.fecha] = obj; } }catch(e){}
        }
      }
      state.reports = reports;
    }catch(e){ state.reports = {}; }
    try{
      const c = await window.storage.get("catalogos_editable", true);
      if(c && c.value) editableCats = JSON.parse(c.value);
    }catch(e){}
    state.loading = false;
    render();
  }
  async function saveReportDay(fecha){
    try{ await window.storage.set("reporte:"+fecha, JSON.stringify(state.reports[fecha]), true); }
    catch(e){ state.errorMsg = "No se pudo guardar en el almacenamiento. Intenta de nuevo."; }
  }
  async function saveCatalogos(){ try{ await window.storage.set("catalogos_editable", JSON.stringify(editableCats), true); }catch(e){} }
  async function loadLastUser(){ try{ const r = await window.storage.get("ultimo_usuario", false); if(r && r.value) state.user = r.value; }catch(e){} }
  async function saveLastUser(u){ try{ await window.storage.set("ultimo_usuario", u, false); }catch(e){} }

  // ---------- stats ----------
  function allCapturas(){
    const out=[];
    Object.values(state.reports).forEach(r=> r.capturas.forEach(c=> out.push({...c, fecha:r.fecha})));
    return out;
  }
  function totalPrevios(){ return allCapturas().reduce((s,c)=> s+(c.previos?c.previos.length:0),0); }
  function totalDespachos(){ return allCapturas().reduce((s,c)=> s+(c.despachos?c.despachos.length:0),0); }
  function last14Days(){
    const days=[];
    for(let i=13;i>=0;i--){ const d=new Date(); d.setDate(d.getDate()-i); days.push(d.toISOString().slice(0,10)); }
    return days.map(iso=>{ const r = state.reports[iso]; return {label: iso.slice(8,10)+"/"+iso.slice(5,7), value: r? r.capturas.length : 0}; });
  }
  function topClientes(){
    const counts = {};
    allCapturas().forEach(c=>{
      [...(c.previos||[]),...(c.despachos||[])].forEach(r=>{ const t=(r.cliente||"").trim(); if(!t) return; counts[t]=(counts[t]||0)+1; });
    });
    return Object.entries(counts).sort((a,b)=>b[1]-a[1]).slice(0,5);
  }

  // ---------- rendering ----------
  function render(){
    if(state.view==="login") root.innerHTML = viewLogin();
    else{
      root.innerHTML = topbar() + `<div class="content">${
        state.loading ? loadingBlock() :
        state.view==="home" ? viewHome() :
        state.view==="capture" ? viewCapture() :
        state.view==="review" ? viewReview() :
        state.view==="stamp" ? viewStamp() :
        state.view==="detail" ? viewDetail() :
        state.view==="catalogos" ? viewCatalogos() : ""
      }</div>`;
    }
    if(state.view==="capture" && state.workingCanvas) requestAnimationFrame(redrawPreview);
  }
  function loadingBlock(){ return `<div class="status-line" style="max-width:320px;margin:40px auto;"><div class="spinner"></div> Cargando reportes…</div>`; }

  function topbar(){
    return `
    <div class="topbar">
      <div class="brand">
        <div class="brand-mark">OW</div>
        <div class="brand-text"><div class="t1">Oñate, Willy &amp; Cía.</div><div class="t2">Reporte operativo diario</div></div>
      </div>
      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
        <div class="user-chip"><span class="user-dot"></span>${esc(state.user)}</div>
        ${state.view!=="home" ? `<button class="nav-btn" onclick="App.goHome()">Inicio</button>` : ""}
        <button class="nav-btn" onclick="App.goCatalogos()">Catálogos</button>
        <button class="nav-btn" onclick="App.logout()">Salir</button>
      </div>
    </div>`;
  }

  function viewLogin(){
    return `
    <div class="login-wrap">
      <div class="login-card">
        <div class="login-mark">OW</div>
        <div class="login-title display">Oñate, Willy &amp; Cía.</div>
        <div class="login-sub">Captura inteligente del reporte operativo diario de previos y despachos</div>
        <div class="user-pick">
          ${USERS.map(u=>`<button class="user-pick-btn" onclick="App.login('${esc(u)}')"><span class="user-avatar">${esc(u.slice(0,2).toUpperCase())}</span> ${esc(u)}</button>`).join("")}
        </div>
      </div>
    </div>`;
  }

  function viewHome(){
    const days = Object.values(state.reports).sort((a,b)=> b.fecha.localeCompare(a.fecha));
    const bars = last14Days();
    const maxVal = Math.max(1, ...bars.map(b=>b.value));
    const tp = totalPrevios(), td = totalDespachos();
    const ranks = topClientes();
    const maxRank = Math.max(1, ...ranks.map(r=>r[1]));

    return `
      <div class="stats-grid">
        <div class="stat-card"><div class="stat-num">${days.length}</div><div class="stat-label">Días con reportes</div></div>
        <div class="stat-card"><div class="stat-num">${allCapturas().length}</div><div class="stat-label">Reportes capturados</div></div>
        <div class="stat-card"><div class="stat-num">${tp}</div><div class="stat-label">Total previos</div></div>
        <div class="stat-card"><div class="stat-num">${td}</div><div class="stat-label">Total despachos</div></div>
      </div>

      <div class="chart-row">
        <div class="panel">
          <div class="section-title">Actividad — últimos 14 días</div>
          <div class="section-sub">Reportes capturados por día</div>

  function donut(a,b){
    const total = a+b;
    if(total===0) return `<div style="color:var(--muted);font-size:13px;padding:20px 0;text-align:center;">Sin datos todavía</div>`;
    const pctA = a/total, r=42, c=2*Math.PI*r; const dashA = pctA*c;
    return `
    <div style="display:flex;align-items:center;gap:18px;">
      <svg viewBox="0 0 110 110" width="100" height="100">
        <circle cx="55" cy="55" r="${r}" fill="none" stroke="#E7ECEF" stroke-width="14"/>
        <circle cx="55" cy="55" r="${r}" fill="none" stroke="var(--navy)" stroke-width="14" stroke-dasharray="${dashA} ${c-dashA}" stroke-dashoffset="${c*0.25}" stroke-linecap="round"/>
        <circle cx="55" cy="55" r="${r}" fill="none" stroke="var(--verde)" stroke-width="14" stroke-dasharray="${c-dashA} ${dashA}" stroke-dashoffset="${c*0.25 - dashA}" stroke-linecap="round"/>
      </svg>
      <div style="font-size:13px;">
        <div style="display:flex;align-items:center;gap:6px;margin-bottom:6px;"><span style="width:10px;height:10px;border-radius:3px;background:var(--navy);display:inline-block;"></span> Previos: <b class="mono">${a}</b></div>

    </div>`;
  }

  // ---------- app logic ----------
  // ---------- free, deterministic DOCX table parser (no AI) ----------
  function cellTextOf(el){ return (el.textContent||"").replace(/\s+/g," ").trim(); }
  function normLabel(l){ return l.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]/g,""); }
  function cleanSignaturePlaceholder(v){ return /^_+$/.test((v||"").replace(/\s/g,"")) ? "" : (v||"").trim(); }

  const HEADER_LABEL_MAP = {
    fecha:"fecha", coordinadorop:"coordinadorOp", coordinador:"coordinador",
    tramitador:"tramitador", aduana:"aduana", horainicio:"horaInicio", horacierre:"horaCierre",
  };

  async function parseDocxTemplate(file){
    if(!window.mammoth) throw new Error("La librería para leer Word no está disponible en este momento.");
    const buf = await file.arrayBuffer();
    const result = await mammoth.convertToHtml({arrayBuffer: buf});
    const doc = new DOMParser().parseFromString(result.value, "text/html");
    const tables = Array.from(doc.querySelectorAll("table"));
    if(tables.length < 4){
      throw new Error("El documento no tiene la estructura esperada (se encontraron " + tables.length + " tablas de 4 esperadas). ¿Es la plantilla 'Reporte Operativo Diario'?");
    }
    const tableRows = (table)=> Array.from(table.querySelectorAll("tr")).map(tr=> Array.from(tr.querySelectorAll("td,th")).map(cellTextOf));

    // --- header info (table 0): cells look like "Fecha: 17/10/2026" ---
    const headerMap = {};
    tableRows(tables[0]).forEach(row=> row.forEach(cell=>{
      const m = cell.match(/^([^:]{2,30}):\s*(.*)$/s);
      if(m){
        const key = HEADER_LABEL_MAP[normLabel(m[1])];
        if(key) headerMap[key] = m[2].trim();
      }
    }));

    // --- table 1: previos ---
    const previosRows = tableRows(tables[1]).slice(1); // skip header row
    const previos = previosRows
      .filter(row => row.some(c=>c))
      .map(row=>{ const o={}; PREVIO_FIELDS.forEach((f,i)=> o[f.k] = row[i]||""); return o; });

    // --- table 2: despachos ---
    const despachosRows = tableRows(tables[2]).slice(1);
    const despachos = despachosRows
      .filter(row => row.some(c=>c))
      .map(row=>{ const o={}; DESPACHO_FIELDS.forEach((f,i)=> o[f.k] = row[i]||""); return o; });

    // --- otras actividades: content between table 2 and table 3 in document order ---
    const bodyChildren = Array.from(doc.body.children);
    const idx2 = bodyChildren.indexOf(tables[2]);
    const idx3 = bodyChildren.indexOf(tables[3]);
    let otrasActividades = [];
    if(idx2>=0 && idx3>idx2){
      bodyChildren.slice(idx2+1, idx3).forEach(el=>{
        if(el.tagName==="OL" || el.tagName==="UL"){
          Array.from(el.querySelectorAll("li")).forEach(li=>{ const t=cellTextOf(li); if(t) otrasActividades.push(t); });
        }else{
          const t = cellTextOf(el);
          if(t && !/otras\s*actividades/i.test(t)) otrasActividades.push(t);
        }
      });
    }
    if(otrasActividades.length===0) otrasActividades = ["","","",""];

    // --- table 3: footer firmas ---
    const footerRows = tableRows(tables[3]);
    const footerVals = footerRows[1] || [];
    const elaboro = cleanSignaturePlaceholder(footerVals[0]);
    const reviso = cleanSignaturePlaceholder(footerVals[1]);
    const autorizo = cleanSignaturePlaceholder(footerVals[2]);

    let fecha = headerMap.fecha || "";
    const fechaMatch = fecha.match(/(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})/);
    if(fechaMatch){
      let [_,d,mo,y] = fechaMatch;
      if(y.length===2) y = "20"+y;
      fecha = `${y}-${mo.padStart(2,"0")}-${d.padStart(2,"0")}`;
    } else { fecha = ""; }

    return {
      fecha, coordinadorOp: headerMap.coordinadorOp||"", coordinador: headerMap.coordinador||"",
      tramitador: headerMap.tramitador||"", horaInicio: headerMap.horaInicio||"", horaCierre: headerMap.horaCierre||"",
      aduana: headerMap.aduana||"", previos, despachos, otrasActividades, elaboro, reviso, autorizo,
    };
  }

  const App = {
    async login(u){ state.user=u; await saveLastUser(u); state.view="home"; state.loading=true; render(); loadReports(); },
    logout(){ state.user=null; state.view="login"; render(); },
    goHome(){ state.view="home"; state.workingCanvas=null; state.workingMode=null; state.workingText=""; state.workingFileName=""; state.workingRotation=0; state.aiStatus=""; state.aiStatusType=""; state.currentCaptura=null; state.errorMsg=""; render(); },
    goCatalogos(){ state.view="catalogos"; render(); },
    startCapture(){ state.view="capture"; state.workingCanvas=null; state.workingMode=null; state.workingText=""; state.workingFileName=""; state.workingRotation=0; state.aiStatus=""; state.aiStatusType=""; state.errorMsg=""; render(); },
    resetCapture(){ state.workingCanvas=null; state.workingMode=null; state.workingText=""; state.workingFileName=""; state.aiStatus=""; state.aiStatusType=""; render(); },

    applyParsedData(parsed, fileName, sourceType){
      const cap = emptyCaptura();
      cap.uploadedBy = state.user;
      cap.horaCaptura = new Date().toISOString();
      cap.sourceType = sourceType;
      cap.sourceFileName = fileName;
      cap.fecha = parsed.fecha && /^\d{4}-\d{2}-\d{2}$/.test(parsed.fecha) ? parsed.fecha : todayStr();
      cap.coordinadorOp = parsed.coordinadorOp||"";
      cap.coordinador = parsed.coordinador||"";
      cap.tramitador = parsed.tramitador||"";
      cap.horaInicio = parsed.horaInicio||"";
      cap.horaCierre = parsed.horaCierre||"";
      cap.aduana = parsed.aduana||"";
      cap.previos = Array.isArray(parsed.previos) ? parsed.previos : [];
      cap.despachos = Array.isArray(parsed.despachos) ? parsed.despachos : [];
      cap.otrasActividades = Array.isArray(parsed.otrasActividades) && parsed.otrasActividades.length ? parsed.otrasActividades : ["","","",""];
      cap.elaboro = parsed.elaboro||"";
      cap.reviso = parsed.reviso||"";
      cap.autorizo = parsed.autorizo||"";
      cap.thumb = null;
      state.currentCaptura = cap;
      state.view = "review";
      render();
    },
    openDetail(fecha){ state.view="detail"; state.detailFecha=fecha; render(); },

    async addCat(k){
      const el = document.getElementById("new_"+k);
      const v = el.value.trim();
      if(!v) return;
      if(!editableCats[k].includes(v)) editableCats[k].push(v);
      await saveCatalogos();
      render();
    },
    async removeCat(k,i){ editableCats[k].splice(i,1); await saveCatalogos(); render(); },

    async handleFile(evt){
      const file = evt.target.files[0];
      if(!file) return;
      state.errorMsg="";
      const name = file.name || "";
      const isDocx = name.toLowerCase().endsWith(".docx") || file.type.includes("wordprocessingml");
      const isPdf = file.type === "application/pdf" || name.toLowerCase().endsWith(".pdf");

      try{
        if(isDocx){
          const parsed = await parseDocxTemplate(file);
          App.applyParsedData(parsed, name, "documento_digital_docx");
          return;
        }
        if(isPdf){
          const buf = await file.arrayBuffer();
          pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
          const pdf = await pdfjsLib.getDocument({data:buf}).promise;
          let fullText = "";
          for(let p=1; p<=pdf.numPages; p++){
            const page = await pdf.getPage(p);
            const content = await page.getTextContent();
            fullText += content.items.map(it=>it.str).join(" ") + "\n\n";
          }
          fullText = fullText.trim();
          if(fullText.length >= 25){
            // PDF has real embedded text: use text mode (cheap & precise)
            state.workingMode = "text";
            state.workingText = fullText;
            state.workingFileName = name;
            state.view = "capture";
            render();
            return;
          }
          // No extractable text -> likely a scanned/photographed PDF, fall back to image mode
          const img = await pdfFirstPageToImage(file);
          setupImageCanvas(img);
          return;
        }
        // image file (jpg/png) -> classic photo flow
        const img = await fileToImage(file);
        setupImageCanvas(img);
      }catch(e){
        state.errorMsg = "No se pudo leer el archivo (" + (e && e.message ? e.message : "error desconocido") + "). Intenta con otro archivo.";
        render();
      }
    },

    rotate(deg){ state.workingRotation = (state.workingRotation + deg) % 360; redrawPreview(); },

    async testConnection(){
      state.testStatus = "Probando…";
      state.testStatusType = "loading";
      render();
      const start = Date.now();
      try{
        const response = await fetch("https://api.anthropic.com/v1/messages", {
          method:"POST",
          headers:{"Content-Type":"application/json"},
          body: JSON.stringify({ model:"claude-sonnet-4-6", max_tokens:20, messages:[{role:"user",content:"Responde solo: OK"}] })
        });
        const ms = Date.now()-start;
        let data;
        try{ data = await response.json(); }catch(e){ throw new Error("HTTP " + response.status + " — respuesta no es JSON válido"); }
        if(!response.ok){
          const apiMsg = data && data.error && data.error.message ? data.error.message : JSON.stringify(data).slice(0,200);
          throw new Error("HTTP " + response.status + ": " + apiMsg);
        }
        state.testStatusType = "";
        state.testStatus = "✅ Conexión exitosa (" + ms + " ms). El servicio de IA respondió correctamente. El problema anterior puede haber sido temporal — intenta analizar tu documento de nuevo.";
      }catch(e){
        state.testStatusType = "error";
        state.testStatus = "❌ Falló la conexión.<div class='err-detail'>" + esc(e && e.message ? e.message : String(e)) + "</div><div class='err-detail' style='margin-top:6px;'>Esto confirma que el navegador/dispositivo no puede contactar el servicio de IA, sin importar el tamaño de la imagen. Prueba desde otro navegador (ej. Chrome si usas Safari, o viceversa) o en modo incógnito, por si una extensión o configuración del navegador lo está bloqueando.</div>";
      }
      render();
    },

    async runExtraction(attempt){
      attempt = attempt || 1;
      const isTextMode = state.workingMode === "text";
      state.aiStatus = attempt===1 ? "Analizando documento con IA…" : "Reintentando…";
      state.aiStatusType = "loading";
      render();
      try{
        const schemaPrompt = `Esquema de salida — devuelve EXCLUSIVAMENTE un objeto JSON válido, sin texto adicional ni markdown:
{
  "fecha": "YYYY-MM-DD o cadena vacía si no es legible",
  "coordinadorOp": "", "coordinador": "", "tramitador": "", "horaInicio": "HH:MM o vacío", "horaCierre": "HH:MM o vacío", "aduana": "",
  "previos": [ {"ref":"","guia":"","cliente":"","almacen":"","partidas":"","tipoPrevio":"","asignacion":"","inicio":"HH:MM","fin":"HH:MM"} ],
  "despachos": [ {"ref":"","guia":"","pedimento":"","cliente":"","almacen":"","inicio":"HH:MM","liberacion":"HH:MM","resultado":""} ],
  "otrasActividades": ["texto de cada actividad listada, en orden"],
  "elaboro": "", "reviso": "", "autorizo": ""
}
No inventes datos: si un campo no aparece, usa cadena vacía "". Extrae TODOS los renglones con datos de ambas tablas, ignora renglones completamente vacíos.`;

        let messageContent;
        if(isTextMode){
          if(!state.workingText || state.workingText.length < 15) throw new Error("No hay texto para analizar.");
          const prompt = `El siguiente es el texto extraído directamente (ya digital, sin OCR) de un "REPORTE OPERATIVO DIARIO DE PREVIOS Y DESPACHOS" de la agencia aduanal Oñate, Willy & Cía. Contiene un encabezado, una tabla "1. CONTROL DE PREVIOS", una tabla "2. CONTROL DE DESPACHOS", una lista "3. Otras Actividades" y firmas (Elaboró/Revisó/Autorizó). El texto puede venir con el formato de tabla distorsionado (columnas mezcladas en el orden de lectura); usa el contexto para ubicar cada valor en su campo correcto.

--- TEXTO DEL DOCUMENTO ---
${state.workingText.slice(0,15000)}
--- FIN DEL TEXTO ---

${schemaPrompt}`;
          messageContent = [{type:"text", text: prompt}];
        }else{
          const quality = attempt===1 ? 0.8 : 0.55;
          const dataUrl = getRotatedDataUrl(quality);
          const base64 = dataUrl.split(",")[1];
          if(!base64 || base64.length < 100) throw new Error("La imagen capturada está vacía o dañada.");
          const prompt = `Eres un asistente experto en documentos operativos de una agencia aduanal mexicana. La imagen adjunta es una hoja de "REPORTE OPERATIVO DIARIO DE PREVIOS Y DESPACHOS" de la empresa Oñate, Willy & Cía, con esta estructura: encabezado (Fecha, Coordinador op., Coordinador, Tramitador, Hora inicio, Hora cierre, Aduana, Total previos, Total despachos), tabla "1. CONTROL DE PREVIOS" (Ref., Guía, Cliente, Almacén, Partidas, Tipo de previo, Asignación, Inicio, Fin), tabla "2. CONTROL DE DESPACHOS" (Ref., Guía, Pedimento, Cliente, Almacén, Inicio, Liberación, Resultado), sección "3. Otras Actividades" (lista numerada), y firmas (Elaboró, Revisó, Autorizó). La letra es manuscrita; transcribe tu mejor lectura, sin inventar datos. Si una celda está vacía, tachada o ilegible, usa cadena vacía "".

${schemaPrompt}`;
          messageContent = [
            {type:"image", source:{type:"base64", media_type:"image/jpeg", data:base64}},
            {type:"text", text:prompt}
          ];
        }

        let response;
        try{
          response = await fetch("https://api.anthropic.com/v1/messages", {
            method:"POST",
            headers:{"Content-Type":"application/json"},
            body: JSON.stringify({
              model: "claude-sonnet-4-6",
              max_tokens: 4000,
              messages: [{ role:"user", content: messageContent }]
            })
          });
        }catch(netErr){
          if(!isTextMode && attempt < 2){
            return App.runExtraction(attempt+1);
          }
          throw new Error("Fallo de red al contactar el servicio de IA (" + netErr.message + "). Revisa tu conexión e intenta de nuevo.");
        }

        let data;
        try{ data = await response.json(); }
        catch(parseErr){ throw new Error("Respuesta no válida del servicio (HTTP " + response.status + ")."); }

        if(!response.ok){
          const apiMsg = data && data.error && data.error.message ? data.error.message : JSON.stringify(data).slice(0,200);
          throw new Error("El servicio de IA respondió con error (HTTP " + response.status + "): " + apiMsg);
        }
        if(!data || !Array.isArray(data.content)){
          throw new Error("La respuesta de la IA no tuvo el formato esperado.");
        }

        let text = data.content.map(b=>b.text||"").join("\n");
        text = text.replace(/```json/g,"").replace(/```/g,"").trim();
        let parsed;
        try{ parsed = JSON.parse(text); }
        catch(e){
          const m = text.match(/\{[\s\S]*\}/);
          if(m){ try{ parsed = JSON.parse(m[0]); }catch(e2){ parsed=null; } }
        }
        if(!parsed) throw new Error(isTextMode ? "No se pudo interpretar la respuesta de la IA. Intenta de nuevo." : "No se pudo interpretar la respuesta de la IA como JSON. Intenta con una foto más clara o mejor iluminada.");

        let thumb = null;
        if(!isTextMode && state.workingCanvas){
          const thumbCanvas = document.createElement("canvas");
          const src = state.workingCanvas;
          const tW = 340, scale = tW/src.width;
          thumbCanvas.width = tW; thumbCanvas.height = src.height*scale;
          thumbCanvas.getContext("2d").drawImage(src,0,0,thumbCanvas.width,thumbCanvas.height);
          thumb = thumbCanvas.toDataURL("image/jpeg",0.6);
        }

        const cap = emptyCaptura();
        cap.uploadedBy = state.user;
        cap.horaCaptura = new Date().toISOString();
        cap.sourceType = isTextMode ? "documento_digital" : "foto";
        cap.sourceFileName = state.workingFileName || "";
        cap.fecha = parsed.fecha && /^\d{4}-\d{2}-\d{2}$/.test(parsed.fecha) ? parsed.fecha : todayStr();
        cap.coordinadorOp = parsed.coordinadorOp||""; cap.coordinador = parsed.coordinador||"";
        cap.tramitador = parsed.tramitador||""; cap.horaInicio = parsed.horaInicio||""; cap.horaCierre = parsed.horaCierre||"";
        cap.aduana = parsed.aduana||"";
        cap.previos = Array.isArray(parsed.previos) ? parsed.previos.map(r=>{ const row={}; PREVIO_FIELDS.forEach(f=>row[f.k]=r[f.k]||""); return row; }) : [];
        cap.despachos = Array.isArray(parsed.despachos) ? parsed.despachos.map(r=>{ const row={}; DESPACHO_FIELDS.forEach(f=>row[f.k]=r[f.k]||""); return row; }) : [];
        cap.otrasActividades = Array.isArray(parsed.otrasActividades) && parsed.otrasActividades.length ? parsed.otrasActividades : ["","","",""];
        cap.elaboro = parsed.elaboro||""; cap.reviso = parsed.reviso||""; cap.autorizo = parsed.autorizo||"";
        cap.thumb = thumb;

        state.currentCaptura = cap;
        state.aiStatus = ""; state.aiStatusType="";
        state.view = "review";
        render();
      }catch(e){
        state.aiStatusType = "error";
        state.aiStatus = "No se pudo analizar el documento.<div class='err-detail'>" + esc(e && e.message ? e.message : String(e)) + "</div>";
        render();
      }
    },

    addRow(group){
      const fields = group==="previos" ? PREVIO_FIELDS : DESPACHO_FIELDS;
      const empty = {}; fields.forEach(f=>empty[f.k]="");
      state.currentCaptura[group].push(empty);
      render();
    },
    updateRow(group,i,key,val){ state.currentCaptura[group][i][key]=val; },
    deleteRow(group,i){ state.currentCaptura[group].splice(i,1); render(); },
    addActividad(){ state.currentCaptura.otrasActividades.push(""); render(); },
    updateActividad(i,val){ state.currentCaptura.otrasActividades[i]=val; },
    deleteActividad(i){ state.currentCaptura.otrasActividades.splice(i,1); render(); },

    async confirmSave(){
      const c = state.currentCaptura;
      c.fecha = document.getElementById("f_fecha").value || todayStr();
      c.coordinadorOp = document.getElementById("f_coordOp").value;
      c.coordinador = document.getElementById("f_coord").value;
      c.tramitador = document.getElementById("f_tram").value;
      c.horaInicio = document.getElementById("f_hIni").value;
      c.horaCierre = document.getElementById("f_hCierre").value;
      c.aduana = document.getElementById("f_aduana").value;
      c.elaboro = document.getElementById("f_elaboro").value;
      c.reviso = document.getElementById("f_reviso").value;
      c.autorizo = document.getElementById("f_autorizo").value;

      if(!state.reports[c.fecha]) state.reports[c.fecha] = {fecha:c.fecha, capturas:[]};
      if(state.editingIndex!==null && state.editingFecha){
        state.reports[state.editingFecha].capturas.splice(state.editingIndex,1);
        if(state.reports[state.editingFecha].capturas.length===0) delete state.reports[state.editingFecha];
        state.editingIndex=null; state.editingFecha=null;
      }
      state.reports[c.fecha].capturas.push(c);
      await saveReportDay(c.fecha);
      state.view="stamp";
      render();
    },

    editCaptura(fecha,idx){
      const c = state.reports[fecha].capturas[idx];
      state.currentCaptura = JSON.parse(JSON.stringify(c));
      state.editingFecha = fecha; state.editingIndex = idx;
      state.view="review";
      render();
    },

    async deleteCaptura(fecha,idx){
      if(!confirm("¿Eliminar esta hoja del reporte?")) return;
      state.reports[fecha].capturas.splice(idx,1);
      if(state.reports[fecha].capturas.length===0){
        try{ await window.storage.delete("reporte:"+fecha, true); }catch(e){}
        delete state.reports[fecha];
        state.view="home";
      }else{ await saveReportDay(fecha); }
      render();
    },

    exportCsv(fecha){
      const d = state.reports[fecha];
      const lines = [];
      lines.push(["Fecha","Coordinador op.","Coordinador","Tramitador","Hora inicio","Hora cierre","Aduana"].join(","));
      d.capturas.forEach(c=> lines.push([c.fecha,c.coordinadorOp,c.coordinador,c.tramitador,c.horaInicio,c.horaCierre,c.aduana].map(v=>`"${String(v||"").replace(/"/g,'""')}"`).join(",")));
      lines.push("");
      lines.push("--- PREVIOS ---");
      lines.push(PREVIO_FIELDS.map(f=>f.label).join(","));
      d.capturas.forEach(c=> (c.previos||[]).forEach(r=> lines.push(PREVIO_FIELDS.map(f=>`"${String(r[f.k]||"").replace(/"/g,'""')}"`).join(","))));
      lines.push("");
      lines.push("--- DESPACHOS ---");
      lines.push(DESPACHO_FIELDS.map(f=>f.label).join(","));
      d.capturas.forEach(c=> (c.despachos||[]).forEach(r=> lines.push(DESPACHO_FIELDS.map(f=>`"${String(r[f.k]||"").replace(/"/g,'""')}"`).join(","))));
      const blob = new Blob([lines.join("\n")], {type:"text/csv;charset=utf-8"});
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a"); a.href=url; a.download=`reporte_${fecha}.csv`; a.click();
      URL.revokeObjectURL(url);
    }
  };
  window.App = App;

  // ---------- image helpers ----------
  function setupImageCanvas(img){
    const canvas = document.createElement("canvas");
    const maxW = 1100;
    const scale = Math.min(1, maxW/img.width);
    canvas.width = Math.round(img.width*scale);
    canvas.height = Math.round(img.height*scale);
    const ctx = canvas.getContext("2d");
    ctx.filter = "contrast(1.15) brightness(1.06) saturate(0.95)";
    ctx.drawImage(img,0,0,canvas.width,canvas.height);
    state.workingCanvas = canvas;
    state.workingMode = "image";
    state.workingRotation = 0;
    state.view="capture";
    render();
  }
  function fileToImage(file){
    return new Promise((resolve,reject)=>{
      const reader = new FileReader();
      reader.onload = ()=>{ const img = new Image(); img.onload=()=>resolve(img); img.onerror=()=>reject(new Error("No se pudo decodificar la imagen")); img.src=reader.result; };
      reader.onerror = ()=>reject(new Error("No se pudo leer el archivo"));
      reader.readAsDataURL(file);
    });
  }
  async function pdfFirstPageToImage(file){
    if(!window.pdfjsLib) throw new Error("El lector de PDF no está disponible en este momento");
    pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
    const buf = await file.arrayBuffer();
    const pdf = await pdfjsLib.getDocument({data:buf}).promise;
    const page = await pdf.getPage(1);
    const viewport = page.getViewport({scale:2});
    const canvas = document.createElement("canvas");
    canvas.width = viewport.width; canvas.height = viewport.height;
    await page.render({canvasContext:canvas.getContext("2d"), viewport}).promise;
    const img = new Image();
    await new Promise((res,rej)=>{ img.onload=res; img.onerror=()=>rej(new Error("No se pudo renderizar el PDF")); img.src=canvas.toDataURL("image/png"); });
    return img;
  }
  function redrawPreview(){
    const el = document.getElementById("previewCanvas");
    if(!el || !state.workingCanvas) return;
    const src = state.workingCanvas;
    const rad = state.workingRotation * Math.PI/180;
    const rot90 = Math.abs(state.workingRotation % 180) === 90;
    const w = rot90 ? src.height : src.width, h = rot90 ? src.width : src.height;
    el.width = w; el.height = h;
    const ctx = el.getContext("2d");
    ctx.save(); ctx.translate(w/2,h/2); ctx.rotate(rad); ctx.drawImage(src, -src.width/2, -src.height/2); ctx.restore();
  }
  function getRotatedDataUrl(quality){
    const el = document.getElementById("previewCanvas");
    return (el || state.workingCanvas).toDataURL("image/jpeg", quality);
  }

  (async function init(){ await loadLastUser(); render(); })();
})();
</script>
